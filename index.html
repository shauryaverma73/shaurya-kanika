<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shaurya & Kanika</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      overflow: hidden;
      color: #fff;
    }

    .background {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(0,0,0,0.45),
        rgba(0,0,0,0.55)),
        url('photos.JPG');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transform: scale(1.05);
    }

    .container {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .save-date {
      text-transform: uppercase;
      letter-spacing: 6px;
      font-size: 14px;
      margin-bottom: 25px;
      opacity: 0.9;
    }

    .names {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      line-height: 1.3;
      text-shadow: 0 6px 30px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }

    .date {
      font-size: 1.2rem;
      letter-spacing: 3px;
      margin-bottom: 45px;
    }

    .countdown {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
    }

    .box {
      width: 120px;
      padding: 25px 15px;
      border-radius: 20px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .number {
      font-size: 2.7rem;
      font-weight: 600;
    }

    .label {
      margin-top: 10px;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .footer {
      position: absolute;
      bottom: 35px;
      font-size: 15px;
      opacity: 0.9;
    }

    @media (max-width: 600px) {
      .box {
        width: 90px;
        padding: 18px 10px;
      }

      .number {
        font-size: 2rem;
      }

      .date {
        font-size: 1rem;
      }

      .footer {
        font-size: 13px;
        padding: 0 20px;
      }
    }
  </style>
</head>

<body>

  <div class="background"></div>

  <div class="container">
    <div class="save-date">Save The Date</div>

    <div class="names">
      Shaurya<br>
      ♥️<br>
      Kanika
    </div>

    <div class="date">
      22 November 2026
    </div>

    <div class="countdown">
      <div class="box">
        <div class="number" id="days">0</div>
        <div class="label">Days</div>
      </div>

      <div class="box">
        <div class="number" id="hours">0</div>
        <div class="label">Hours</div>
      </div>

      <div class="box">
        <div class="number" id="minutes">0</div>
        <div class="label">Minutes</div>
      </div>

      <div class="box">
        <div class="number" id="seconds">0</div>
        <div class="label">Seconds</div>
      </div>
    </div>

    <div class="footer">
      Our Forever Begins ❤️
    </div>
  </div>

  <script>
    const weddingDate = new Date(
      "November 22, 2026 00:00:00"
    ).getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = weddingDate - now;

      if (distance <= 0) {
        document.querySelector(".countdown").innerHTML =
          "<h1>🎉 Just Married ❤️</h1>";
        return;
      }

      const days = Math.floor(
        distance / (1000 * 60 * 60 * 24)
      );

      const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24)) /
        (1000 * 60 * 60)
      );

      const minutes = Math.floor(
        (distance % (1000 * 60 * 60)) /
        (1000 * 60)
      );

      const seconds = Math.floor(
        (distance % (1000 * 60)) / 1000
      );

      document.getElementById("days").innerText = days;
      document.getElementById("hours").innerText =
        String(hours).padStart(2, "0");
      document.getElementById("minutes").innerText =
        String(minutes).padStart(2, "0");
      document.getElementById("seconds").innerText =
        String(seconds).padStart(2, "0");
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
