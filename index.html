<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shaurya & Kanika</title>

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cormorant Garamond', serif;
      height: 100vh;
      overflow: hidden;
      color: white;
    }

    .background {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(
          circle,
          rgba(0,0,0,0.15) 20%,
          rgba(0,0,0,0.65) 100%
        ),
        url('photos.JPG');

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      animation: zoomBackground 20s ease-in-out infinite alternate;
    }

    @keyframes zoomBackground {
      from {
        transform: scale(1);
      }
      to {
        transform: scale(1.08);
      }
    }

    .container {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .save-date {
      text-transform: uppercase;
      letter-spacing: 6px;
      font-size: 1rem;
      margin-bottom: 20px;
      text-shadow:
        0 2px 10px rgba(0,0,0,0.8);
    }

    .names {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(4rem, 10vw, 8rem);
      line-height: 1.1;
      margin-bottom: 20px;

      text-shadow:
        0 4px 15px rgba(0,0,0,0.8),
        0 8px 30px rgba(0,0,0,0.7),
        0 12px 50px rgba(0,0,0,0.6);
    }

    .date {
      font-size: 1.4rem;
      letter-spacing: 4px;
      margin-bottom: 45px;

      text-shadow:
        0 2px 10px rgba(0,0,0,0.8);
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .box {
      width: 110px;
      min-height: 110px;
      padding: 20px;
      border-radius: 24px;

      background: rgba(255,255,255,0.14);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.2);

      box-shadow:
        0 15px 40px rgba(0,0,0,0.45),
        inset 0 1px 1px rgba(255,255,255,0.25);
    }

    .number {
      font-size: 2.6rem;
      font-weight: 600;
      text-shadow:
        0 3px 12px rgba(0,0,0,0.7);
    }

    .label {
      margin-top: 10px;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow:
        0 2px 8px rgba(0,0,0,0.7);
    }

    .footer {
      position: absolute;
      bottom: 35px;
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-shadow:
        0 2px 10px rgba(0,0,0,0.8);
    }

    @media (max-width: 768px) {
      .names {
        font-size: 5rem;
      }

      .box {
        width: 90px;
        min-height: 90px;
        padding: 15px;
      }

      .number {
        font-size: 2rem;
      }

      .date {
        font-size: 1.2rem;
      }
    }

    @media (max-width: 480px) {
      .save-date {
        font-size: 0.8rem;
        letter-spacing: 4px;
      }

      .names {
        font-size: 3.5rem;
      }

      .date {
        font-size: 1rem;
        letter-spacing: 2px;
      }

      .box {
        width: 72px;
        min-height: 72px;
        padding: 12px;
      }

      .number {
        font-size: 1.4rem;
      }

      .label {
        font-size: 9px;
        letter-spacing: 1px;
      }

      .footer {
        font-size: 0.9rem;
        bottom: 20px;
      }
    }
  </style>
</head>

<body>

<div class="background"></div>

<div class="container">

  <div class="save-date">
    Save The Date
  </div>

  <div class="names">
    Shaurya & Kanika
  </div>

  <div class="date">
    22 November 2026
  </div>

  <div class="countdown">
    <div class="box">
      <div class="number" id="days">0</div>
      <div class="label">Days</div>
    </div>

    <div class="box">
      <div class="number" id="hours">0</div>
      <div class="label">Hours</div>
    </div>

    <div class="box">
      <div class="number" id="minutes">0</div>
      <div class="label">Minutes</div>
    </div>

    <div class="box">
      <div class="number" id="seconds">0</div>
      <div class="label">Seconds</div>
    </div>
  </div>

  <div class="footer">
    Our Forever Begins ❤️
  </div>

</div>

<script>
  const weddingDate = new Date(
    "November 22, 2026 00:00:00"
  ).getTime();

  function updateCountdown() {
    const now = new Date().getTime();
    const distance = weddingDate - now;

    if (distance <= 0) {
      document.querySelector(".countdown").innerHTML =
        "<h1>🎉 Just Married ❤️</h1>";
      return;
    }

    const days = Math.floor(
      distance / (1000 * 60 * 60 * 24)
    );

    const hours = Math.floor(
      (distance % (1000 * 60 * 60 * 24)) /
      (1000 * 60 * 60)
    );

    const minutes = Math.floor(
      (distance % (1000 * 60 * 60)) /
      (1000 * 60)
    );

    const seconds = Math.floor(
      (distance % (1000 * 60)) / 1000
    );

    document.getElementById("days").innerText = days;
    document.getElementById("hours").innerText =
      String(hours).padStart(2, "0");
    document.getElementById("minutes").innerText =
      String(minutes).padStart(2, "0");
    document.getElementById("seconds").innerText =
      String(seconds).padStart(2, "0");
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>

</body>
</html>
